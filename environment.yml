name: hza_tagger
channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - pip

  # Core scientific stack
  - numpy<2.4,>=2.2.6
  - scipy
  - matplotlib>=3.10.8,<3.11   # Satisfies both mplhep (>=3.10.8) and puma-hep (<3.11)
  - scikit-learn>=1.4

  # ROOT / HEP
  - uproot>=5.3
  - awkward>=2.6
  - coffea>=2024.1
  - h5py>=3.10

  # YAML / config
  - pyyaml>=6.0

  # Dask (local + HTCondor scale-out)
  - dask>=2024.1
  - distributed>=2024.1

  # Notebook
  - jupyterlab
  - ipykernel

  - pip:
      # setuptools<81 required: pkg_resources compatibility
      - setuptools<81

      # Deep learning — strictly pinned for SALT 0.13.0 compatibility
      - torch==2.12.0+cu126 # needed to run on naf's P100s or Tesla V100-SXM2
      - torchvision
      - lightning==2.6.1

      # SALT runtime dependencies
      - jsonargparse>=4.39.0
      - importlib_resources
      - atlas-ftag-tools==0.3.3   # Strictly pinned for SALT 0.13.0
      - comet_ml

      # HTCondor job submission
      - dask-jobqueue>=0.8

      # Install local editable SALT repository
      # - -e tagger/salt

      # Dev / test
      - pytest>=8
      - pytest-cov
